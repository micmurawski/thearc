site_name: thearc
site_url: https://micmurawski.github.io/thearc/
site_description: Improve AI agents' configurations from evidence of how they behaved — reflection, curation, and merging across harnesses.
repo_url: https://github.com/micmurawski/thearc
edit_uri: ''
docs_dir: docs
site_dir: site
strict: true

theme:
  name: mkdocs
  color_mode: auto
  navigation_depth: 3

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true

exclude_docs: |
  **/__pycache__/
  **/*.pyc

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - Install: start/installation.md
      - Your first ACE run: start/first-ace.md
  - Guides:
      - Manage configuration: guides/metaagent.md
      - Index and select sessions: guides/sessions.md
      - Generate reflections: guides/reflections.md
      - Curate changes: guides/curation.md
      - Merge candidates: guides/merging.md
      - See how an agent evolved: guides/report.md
      - Cookbook: examples/index.md
  - Reference:
      - Runtime support: reference/runtimes.md
      - CLI: reference/cli.md
  - Development:
      - Contributing: development/index.md
      - Package releases: development/releases.md
      - Maintain these docs: development/documentation.md
