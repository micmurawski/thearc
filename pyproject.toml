[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thearc"
version = "0.1.0"
description = "Agent-agnostic plugin & skill installer system for Codex, Claude, and Antigravity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
thearc = "thearc.cli:main"

[tool.setuptools.packages.find]
include = ["thearc*"]

[tool.setuptools.package-data]
"thearc.flow" = ["viz.css", "viz.js"]

[project.optional-dependencies]
docs = ["mkdocs>=1.6,<2"]
codex = ["openai-codex==0.157.1"]
antigravity = ["google-antigravity==0.1.19"]
arrow = ["pyarrow>=14.0.0"]
dev = [
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg", "node_modules", "venv", "fastapi"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/fastapi"]

[tool.ruff.lint]
extend-select = ["E501"]
