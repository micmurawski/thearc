name: Package release

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must match pyproject.toml: v{version}")
          PY
      - run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test installed wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/release-smoke/bin/python" -I -c 'from importlib.resources import files; from thearc import MetaAgent; from thearc.learning import SessionStore; from thearc.learning.curation import create_curator; from thearc.learning.reflection import create_reflector; assert MetaAgent(name="smoke").name == "smoke"; assert all(files("thearc.flow").joinpath(asset).is_file() for asset in ("viz.css", "viz.js"))'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/thearc" --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.repository == 'micmurawski/thearc'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/thearc
    permissions:
      id-token: write
    concurrency:
      group: pypi-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
